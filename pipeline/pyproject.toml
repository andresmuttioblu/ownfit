[project]
name = "ownfit-pipeline"
version = "0.1.0"
description = "Local import pipeline: wardrobe video + photos -> clean, background-removed garment images."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy",
  "opencv-python-headless",
  "pillow",
  "rembg[cpu]",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ownfit_pipeline"]
